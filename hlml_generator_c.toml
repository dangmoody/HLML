# HLML generator config - C.
#
# Pass the path to this file as the generator's first command line argument, e.g.
# (from the repo root, after `builder build.cpp --config=generator`):
#
#   bin/debug/hlml-generator hlml_generator_c.toml
#
# A config file is required and always generates exactly one language, chosen by "language" below.
# To generate both C and C++ output, run the generator twice - once with this file, once with hlml_generator_cpp.toml.
# The values shown here reproduce the checked-in code/generated_files/c/
# and code/generated_files/c/tests/ output exactly.

language = "c"

# Folder that API code is written to, with no trailing slash.
# Tests go in <output_path>/tests/.
# The language is not auto-appended.
output_path = "code/generated_files/c"

# Prefix for the constants in hlml_constants.h (HLML_PI, HLML_TAU, etc.).
# Empty means no prefix.
constants_prefix = "HLML_"

# Filename of the umbrella header that includes every generated API file.
# Cannot be empty.
main_header_name = "hlml.h"

# Prefix for generated filenames (hlml_types.h, hlml_constants.h, hlml_functions_*.h, etc.).
# Empty means no prefix.
file_prefix = "hlml_"

# Scalar types to generate vectors/matrices for.
# Bool is forced on while generate_relational_operators is enabled.
scalar_types = [ "bool", "int", "uint", "float", "double" ]

# Inclusive component count range for vectors and matrix rows/cols.
# Must be within [2, 4].
component_count_min = 2
component_count_max = 4

# Treat float4/double4 as quaternions.
# Automatically disabled if float/double or 4-component types are excluded.
generate_quaternions = true

# Generate non-square matrices (e.g. float2x3).
generate_non_square_matrices = true

# Generate the SSE API (float only).
generate_sse = true

# Pass parameters by pointer instead of by reference.
parms_are_pointers = true

# Wrap the API in extern "C" guards.
# Cannot be combined with allow_namespace.
c_linkage = true

# Generate overloaded operators.
# C++ only.
generate_operators = false

# Generate operator=.
# Requires generate_operators.
# C++ only.
generate_assignment_operator = false

# Rely on C++ overloading for function names (e.g. "add" instead of "float3_add").
name_mangling = false

# Case style for function names: "snake_case", "PascalCase" or "camelCase".
# E.g. "float3_look_at_lh" becomes "Float3LookAtLh" or "float3LookAtLh".
# Structural single-letter markers (the scalar type suffix in e.g. "lerpf", and the component-wise "c"/"s"/"v"/"m" markers in e.g. "cadds") always stay lowercase regardless of style.
function_name_case = "snake_case"

# Wrap vector members in an anonymous union with a v[] array, swizzles and rgba members.
vector_unions = false

# Suppress pedantic/C4201 warnings around anonymous structs/unions.
# Requires vector_unions.
suppress_anonymous_struct_warnings = true

# Generate rgba members/swizzles alongside xyzw.
# Requires vector_unions.
generate_rgba = false

# Generate constructors/destructors.
# C++ only.
generate_constructors = false

# Generate HLSL-style swizzles (e.g. ".xyz").
# C++ only.
vector_swizzles = false

# Allow wrapping in a "hlml" namespace via HLML_NAMESPACE.
# Cannot be combined with c_linkage.
allow_namespace = false

# Generate <, <=, >, >= for every type.
# == and != are always generated.
generate_relational_operators = true

# Put opening braces on the same line (K&R) instead of on their own line (Allman).
braces_same_line = false

# Attach '*'/'&' to the name (e.g. "float3 *vec") instead of the type (e.g. "float3* vec").
reference_operator_attach_to_variable = true

# Prepend the "automatically generated" comment to every generated file.
generate_header_comment = true
