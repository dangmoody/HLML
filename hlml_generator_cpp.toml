# HLML generator config - C++.
#
# Pass the path to this file as the generator's first command line argument, e.g.
# (from the repo root, after `builder build.cpp --config=generator`):
#
#   bin/debug/hlml-generator hlml_generator_cpp.toml
#
# A config file is required and always generates exactly one language, chosen by "language" below.
# To generate both C and C++ output, run the generator twice - once with this file, once with
# hlml_generator_c.toml. The values shown here reproduce the checked-in code/generated_files/cpp/
# and code/generated_files/cpp/tests/ output exactly.

language = "cpp"

# Folder the API code is written into; tests are written to <output_path>/tests/ beneath it. No
# trailing slash. Unlike before, the language is NOT auto-appended - if you want a per-language
# subfolder (as the checked-in output does), put it in this path yourself, as below.
output_path = "code/generated_files/cpp"

# Which scalar kinds participate in vector/matrix generation.
# NOTE: "bool" can only be excluded here if "generate_relational_operators" (below) is also disabled -
# relational operators (<, <=, >, >=) on every other type return a bool vector/matrix, so bool is
# forced back on regardless of this list while they're enabled. Equality (==, !=) is unaffected either
# way, since it always returns a plain scalar bool.
scalar_types = [ "bool", "int", "uint", "float", "double" ]

# Inclusive component-count range, applied to both vector component counts and matrix rows/cols.
# Must be within [2, 4].
component_count_min = 2
component_count_max = 4

# Whether quaternion types/functions (float4 and double4 treated as quaternions) are generated.
# Automatically disabled if float/double or 4-component types are excluded above.
generate_quaternions = true

# Whether non-square matrices (e.g. float2x3, float4x2) are generated, in addition to square ones.
generate_non_square_matrices = true

# Whether the SSE API (hlml_functions_scalar_sse.h/hlml_functions_vector_sse.h and their #includes in
# hlml.h) is generated, for the types that support it (currently just float).
generate_sse = true

# Whether function parameters are passed by pointer, C style (`*`/`->`), or by reference, C++ style
# (`&`/`.`).
parms_are_pointers = false

# Whether the API is wrapped in extern "C" guards. Cannot be combined with allow_namespace, since
# namespaces are a C++-only concept.
c_linkage = false

# Whether overloaded operators (+, -, ==, etc.) are generated. C++ only.
generate_operators = true

# Whether vector/matrix types generate operator=. Only meaningful when generate_operators is also
# enabled. C++ only.
generate_assignment_operator = true

# Whether generated function names rely on C++ overload resolution (e.g. "add") instead of being
# suffixed per type (e.g. "float3_add").
name_mangling = true

# Whether vector types wrap their members in an anonymous union that also exposes a v[] array and (if
# vector_swizzles/generate_rgba are on) swizzle/rgba members, all aliasing the same memory. If off,
# vectors only have plain x/y/z/w members.
vector_unions = true

# Whether vector types' anonymous struct/union members are wrapped in a push/pop of Clang/GCC's
# -Wpedantic and MSVC's C4201, since anonymous structs/unions are a nonstandard extension. Only
# meaningful when vector_unions is also enabled.
suppress_anonymous_struct_warnings = true

# Whether rgba-named vector members (and, if vector_swizzles is on, rgba-named swizzles) are generated
# alongside xyzw, inside the same union. Requires vector_unions to be enabled - the generator errors out
# otherwise, since rgba members have nowhere to live without that union.
generate_rgba = true

# Whether constructors (and destructors) are generated for vector/matrix types. C++ only.
generate_constructors = true

# Whether HLSL-style vector swizzles (e.g. ".xyz") are generated. C++ only.
vector_swizzles = true

# Whether generated code can optionally be wrapped in a "hlml" namespace, behind the HLML_NAMESPACE
# #define. Cannot be combined with c_linkage.
allow_namespace = true

# Whether <, <=, >, >= are generated for every type. Equality (==, !=) is unaffected by this - it's
# always generated, since the generated tests rely on it to check their results.
generate_relational_operators = true
